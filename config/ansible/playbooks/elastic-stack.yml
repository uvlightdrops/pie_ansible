---
- name: Deploy Elasticsearch and Kibana
  hosts: alf
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate target operating system
      ansible.builtin.assert:
        that:
          - >-
            (ansible_distribution == 'Ubuntu' and
             ansible_distribution_version is version('24.04', '>=') and
             ansible_distribution_version is version('24.10', '<')) or
            (ansible_distribution == 'SLES' and
             ansible_distribution_major_version == '15')
        fail_msg: >-
          Supported systems are Ubuntu 24 LTS and SLES 15; found
          {{ ansible_distribution }} {{ ansible_distribution_version }}.

    - name: Require vaulted deployment credentials
      ansible.builtin.assert:
        that:
          - elasticsearch_bootstrap_password is defined
          - elasticsearch_bootstrap_password | length >= 20
          - not elastic_stack_deploy_kibana or kibana_system_password is defined
          - not elastic_stack_deploy_kibana or kibana_system_password | length >= 20
        fail_msg: >-
          Create and encrypt a local vault from
          config/ansible/group_vars/elastic/vault.yml.example and link it as
          config/ansible/group_vars/elastic/vault.yml before deployment.

  roles:
    - common
    - role: elasticsearch
      when: elastic_stack_deploy_elasticsearch
    - role: kibana
      when: elastic_stack_deploy_kibana
