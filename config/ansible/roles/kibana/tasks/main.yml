---
- name: Create package cache on target
  ansible.builtin.file:
    path: "{{ elastic_stack_package_cache }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Select Kibana artifact for this platform
  ansible.builtin.set_fact:
    kibana_package_source: "{{ elastic_stack_artifacts.kibana }}"
    kibana_package_version: "{{ elastic_stack_package_versions.kibana }}"

- name: Copy Kibana package to target
  ansible.builtin.copy:
    src: "{{ kibana_package_source }}"
    dest: "{{ elastic_stack_package_cache }}/{{ kibana_package_source | basename }}"
    owner: root
    group: root
    mode: "0640"
  register: kibana_package_copy

- name: Read Kibana DEB package version
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - --field
      - "{{ elastic_stack_package_cache }}/{{ kibana_package_source | basename }}"
      - Version
  when: ansible_distribution == 'Ubuntu'
  changed_when: false
  register: kibana_deb_package_metadata

- name: Read Kibana RPM package version
  ansible.builtin.command:
    argv:
      - rpm
      - -qp
      - --queryformat
      - "%{VERSION}"
      - "{{ elastic_stack_package_cache }}/{{ kibana_package_source | basename }}"
  when: ansible_distribution == 'SLES'
  changed_when: false
  register: kibana_rpm_package_metadata

- name: Verify Kibana package metadata
  ansible.builtin.assert:
    that:
      - >-
        (kibana_deb_package_metadata.stdout if ansible_distribution == 'Ubuntu'
        else kibana_rpm_package_metadata.stdout)
        | regex_search('^[0-9]+\.[0-9]+\.[0-9]+') == kibana_package_version
    fail_msg: The Kibana package metadata does not match its filename.

- name: Read installed Kibana package versions
  ansible.builtin.package_facts:
    manager: auto

- name: Prevent an implicit Kibana downgrade
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.packages.get('kibana', [])
        | map(attribute='version') | list | first
        is version(kibana_package_version, '<=')
    fail_msg: >-
      The installed Kibana version is newer than the staged package.
      Review and perform any downgrade as a separate change.
  when: "'kibana' in ansible_facts.packages"

- name: Install Kibana DEB package
  ansible.builtin.apt:
    deb: "{{ elastic_stack_package_cache }}/{{ kibana_package_source | basename }}"
    state: present
    policy_rc_d: 101
  when: ansible_distribution == 'Ubuntu'
  notify: Restart kibana

- name: Install Kibana RPM package
  ansible.builtin.command:
    argv:
      - zypper
      - --non-interactive
      - install
      - --no-refresh
      - --no-recommends
      - "{{ elastic_stack_package_cache }}/{{ kibana_package_source | basename }}"
  when:
    - ansible_distribution == 'SLES'
    - >-
      'kibana' not in ansible_facts.packages or
      ansible_facts.packages.kibana | map(attribute='version') | first
      != kibana_package_version
  changed_when: true
  notify: Restart kibana

- name: Stop Kibana before applying configuration
  ansible.builtin.systemd_service:
    name: kibana
    state: stopped

- name: Create Kibana certificate directory
  ansible.builtin.file:
    path: "{{ kibana_certificate_path }}"
    state: directory
    owner: root
    group: kibana
    mode: "0750"

- name: Install Kibana CA certificate
  ansible.builtin.copy:
    src: "{{ kibana_certificate_source_dir }}/ca.crt"
    dest: "{{ kibana_ca_certificate }}"
    owner: root
    group: kibana
    mode: "0640"
  notify: Restart kibana

- name: Read Elasticsearch version before configuring Kibana
  ansible.builtin.uri:
    url: "https://{{ elasticsearch_api_host }}:{{ elasticsearch_http_port }}/"
    method: GET
    user: elastic
    password: "{{ elasticsearch_bootstrap_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ kibana_ca_certificate }}"
    status_code: 200
  no_log: true
  register: kibana_elasticsearch_info
  until: kibana_elasticsearch_info.status | default(-1) == 200
  retries: 20
  delay: 3

- name: Require matching Elasticsearch and Kibana versions
  ansible.builtin.assert:
    that:
      - kibana_elasticsearch_info.json.version.number == kibana_package_version
    fail_msg: Elasticsearch and Kibana must have the same version.

- name: Set Kibana system account password
  ansible.builtin.uri:
    url: "https://{{ elasticsearch_api_host }}:{{ elasticsearch_http_port }}/_security/user/kibana_system/_password"
    method: PUT
    user: elastic
    password: "{{ elasticsearch_bootstrap_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ kibana_ca_certificate }}"
    body_format: json
    body:
      password: "{{ kibana_system_password }}"
    status_code: 200
  no_log: true
  register: kibana_password_result
  until: kibana_password_result.status | default(-1) == 200
  retries: 20
  delay: 3
  changed_when: false

- name: Install Kibana server certificate
  ansible.builtin.copy:
    src: "{{ kibana_certificate_source_dir }}/kibana.crt"
    dest: "{{ kibana_server_certificate }}"
    owner: root
    group: kibana
    mode: "0640"
  notify: Restart kibana

- name: Install Kibana server private key
  ansible.builtin.copy:
    src: "{{ kibana_certificate_source_dir }}/kibana.key"
    dest: "{{ kibana_server_key }}"
    owner: root
    group: kibana
    mode: "0640"
  notify: Restart kibana

- name: Configure Kibana
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: "0640"
  no_log: true
  notify: Restart kibana

- name: Apply Kibana configuration before service setup
  ansible.builtin.meta: flush_handlers

- name: Enable and start Kibana
  ansible.builtin.systemd_service:
    name: kibana
    enabled: true
    state: started
