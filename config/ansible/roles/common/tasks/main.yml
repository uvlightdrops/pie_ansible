---
- name: Find Elasticsearch DEB package
  ansible.builtin.find:
    paths: "{{ elastic_stack_elasticsearch_deb_dir }}"
    patterns: elasticsearch-*.deb
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  run_once: true
  register: elasticsearch_deb_scan
  when: elastic_stack_deploy_elasticsearch

- name: Find Elasticsearch RPM package
  ansible.builtin.find:
    paths: "{{ elastic_stack_elasticsearch_rpm_dir }}"
    patterns: elasticsearch-*.rpm
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  run_once: true
  register: elasticsearch_rpm_scan
  when: elastic_stack_deploy_elasticsearch

- name: Find Kibana DEB package
  ansible.builtin.find:
    paths: "{{ elastic_stack_kibana_deb_dir }}"
    patterns: kibana-*.deb
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  run_once: true
  register: kibana_deb_scan
  when: elastic_stack_deploy_kibana

- name: Find Kibana RPM package
  ansible.builtin.find:
    paths: "{{ elastic_stack_kibana_rpm_dir }}"
    patterns: kibana-*.rpm
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  run_once: true
  register: kibana_rpm_scan
  when: elastic_stack_deploy_kibana

- name: Validate package file names and availability
  ansible.builtin.assert:
    that:
      - >-
        not elastic_stack_deploy_elasticsearch or elasticsearch_deb_scan.files
        | selectattr('path', 'search', 'elasticsearch-[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9_]+\.deb$')
        | list | length == 1
      - >-
        not elastic_stack_deploy_elasticsearch or elasticsearch_deb_scan.files | length == 1
      - >-
        not elastic_stack_deploy_elasticsearch or elasticsearch_rpm_scan.files
        | selectattr('path', 'search', 'elasticsearch-[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9_]+\.rpm$')
        | list | length == 1
      - >-
        not elastic_stack_deploy_elasticsearch or elasticsearch_rpm_scan.files | length == 1
      - >-
        not elastic_stack_deploy_kibana or kibana_deb_scan.files
        | selectattr('path', 'search', 'kibana-[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9_]+\.deb$')
        | list | length == 1
      - >-
        not elastic_stack_deploy_kibana or kibana_deb_scan.files | length == 1
      - >-
        not elastic_stack_deploy_kibana or kibana_rpm_scan.files
        | selectattr('path', 'search', 'kibana-[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9_]+\.rpm$')
        | list | length == 1
      - >-
        not elastic_stack_deploy_kibana or kibana_rpm_scan.files | length == 1
    fail_msg: >-
      Each package directory for the selected services must contain exactly
      one correctly named package:
      {{ elastic_stack_elasticsearch_deb_dir }},
      {{ elastic_stack_elasticsearch_rpm_dir }},
      {{ elastic_stack_kibana_deb_dir }} and
      {{ elastic_stack_kibana_rpm_dir }}. Package names must include version
      and architecture (for example elasticsearch-8.19.0-amd64.deb).
  run_once: true

- name: Record Elasticsearch package files and versions on the controller
  ansible.builtin.set_fact:
    elastic_stack_artifacts:
      elasticsearch_deb: "{{ elasticsearch_deb_scan.files[0].path }}"
      elasticsearch_rpm: "{{ elasticsearch_rpm_scan.files[0].path }}"
    elastic_stack_package_versions:
      elasticsearch_deb: >-
        {{ (elasticsearch_deb_scan.files[0].path | basename).split('-')[1] }}
      elasticsearch_rpm: >-
        {{ (elasticsearch_rpm_scan.files[0].path | basename).split('-')[1] }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  when: elastic_stack_deploy_elasticsearch

- name: Record Kibana package files and versions on the controller
  ansible.builtin.set_fact:
    elastic_stack_artifacts: >-
      {{ hostvars['localhost'].elastic_stack_artifacts | default({}) | combine({
        'kibana_deb': kibana_deb_scan.files[0].path,
        'kibana_rpm': kibana_rpm_scan.files[0].path
      }) }}
    elastic_stack_package_versions: >-
      {{ hostvars['localhost'].elastic_stack_package_versions | default({}) | combine({
        'kibana_deb': (kibana_deb_scan.files[0].path | basename).split('-')[1],
        'kibana_rpm': (kibana_rpm_scan.files[0].path | basename).split('-')[1]
      }) }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  when: elastic_stack_deploy_kibana

- name: Require matching Elasticsearch and Kibana package versions
  ansible.builtin.assert:
    that:
      - not elastic_stack_deploy_elasticsearch or hostvars['localhost'].elastic_stack_package_versions.elasticsearch_deb == hostvars['localhost'].elastic_stack_package_versions.elasticsearch_rpm
      - not elastic_stack_deploy_kibana or hostvars['localhost'].elastic_stack_package_versions.kibana_deb == hostvars['localhost'].elastic_stack_package_versions.kibana_rpm
      - not (elastic_stack_deploy_elasticsearch and elastic_stack_deploy_kibana) or hostvars['localhost'].elastic_stack_package_versions.elasticsearch_deb == hostvars['localhost'].elastic_stack_package_versions.kibana_deb
    fail_msg: >-
      Ubuntu and SLES packages for each selected service must match; when
      deploying both services their package versions must also match.
  run_once: true

- name: Check that certificate files are present on the controller
  ansible.builtin.stat:
    path: "{{ elastic_stack_certificate_source_dir }}/{{ item }}"
  loop: >-
    {{ ['ca.crt']
       + (['elasticsearch.crt', 'elasticsearch.key'] if elastic_stack_deploy_elasticsearch else [])
       + (['kibana.crt', 'kibana.key'] if elastic_stack_deploy_kibana else []) }}
  delegate_to: localhost
  become: false
  register: elastic_stack_certificate_stats

- name: Require certificate files for selected services
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: >-
      Required certificate file {{ item.item }} is missing from
      {{ elastic_stack_certificate_source_dir }}.
  loop: "{{ elastic_stack_certificate_stats.results }}"

- name: Check for legacy Elasticsearch data outside /srv
  ansible.builtin.stat:
    path: /var/lib/elasticsearch/nodes
  register: elasticsearch_legacy_data
  when: elastic_stack_deploy_elasticsearch

- name: Protect legacy Elasticsearch data
  ansible.builtin.assert:
    that:
      - not elasticsearch_legacy_data.stat.exists
    fail_msg: >-
      Existing Elasticsearch data was found under /var/lib/elasticsearch.
      Migrate or explicitly review it before switching to /srv/elasticsearch/data.
  when: elastic_stack_deploy_elasticsearch
