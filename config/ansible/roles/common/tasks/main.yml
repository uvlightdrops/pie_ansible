---
- name: Find packages for selected services and target platform
  ansible.builtin.find:
    paths: "{{ item.directory }}"
    patterns: "{{ item.service }}-*.{{ elastic_stack_package_format }}"
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  vars:
    elastic_stack_package_format: "{{ 'deb' if ansible_distribution == 'Ubuntu' else 'rpm' }}"
  loop: >-
    {{ ([{'service': 'elasticsearch', 'directory': elastic_stack_elasticsearch_deb_dir
          if ansible_distribution == 'Ubuntu' else elastic_stack_elasticsearch_rpm_dir}]
        if elastic_stack_deploy_elasticsearch else [])
       + ([{'service': 'kibana', 'directory': elastic_stack_kibana_deb_dir
            if ansible_distribution == 'Ubuntu' else elastic_stack_kibana_rpm_dir}]
          if elastic_stack_deploy_kibana else []) }}
  loop_control:
    label: "{{ item.service }}: {{ item.directory }}"
  register: elastic_stack_package_scans

- name: Validate package file names and availability
  ansible.builtin.assert:
    that:
      - item.files | length == 1
      - >-
        item.files | selectattr('path', 'search',
        item.item.service ~ '-[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9_]+\.' ~ elastic_stack_package_format ~ '$')
        | list | length == 1
    fail_msg: >-
      {{ item.item.directory }} must contain exactly one {{ item.item.service }}
      {{ elastic_stack_package_format }} package named with version and
      architecture (for example elasticsearch-7.10.2-amd64.deb).
  vars:
    elastic_stack_package_format: "{{ 'deb' if ansible_distribution == 'Ubuntu' else 'rpm' }}"
  loop: "{{ elastic_stack_package_scans.results }}"
  loop_control:
    label: "{{ item.item.service }}: {{ item.item.directory }}"

- name: Record selected package files and versions for this host
  ansible.builtin.set_fact:
    elastic_stack_artifacts: "{{ elastic_stack_artifacts | default({}) | combine({item.item.service: item.files[0].path}) }}"
    elastic_stack_package_versions: "{{ elastic_stack_package_versions | default({}) | combine({item.item.service: (item.files[0].path | basename).split('-')[1]}) }}"
  loop: "{{ elastic_stack_package_scans.results }}"
  loop_control:
    label: "{{ item.item.service }}"

- name: Require matching Elasticsearch and Kibana package versions
  ansible.builtin.assert:
    that:
      - elastic_stack_package_versions.elasticsearch == elastic_stack_package_versions.kibana
    fail_msg: Elasticsearch and Kibana package versions must match.
  when: elastic_stack_deploy_elasticsearch and elastic_stack_deploy_kibana

- name: Check that certificate files are present on the controller
  ansible.builtin.stat:
    path: "{{ elastic_stack_certificate_source_dir }}/{{ item }}"
  loop: >-
    {{ ['ca.crt']
       + (['elasticsearch.crt', 'elasticsearch.key'] if elastic_stack_deploy_elasticsearch else [])
       + (['kibana.crt', 'kibana.key'] if elastic_stack_deploy_kibana else []) }}
  delegate_to: localhost
  become: false
  register: elastic_stack_certificate_stats

- name: Require certificate files for selected services
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: >-
      Required certificate file {{ item.item }} is missing from
      {{ elastic_stack_certificate_source_dir }}.
  loop: "{{ elastic_stack_certificate_stats.results }}"

- name: Check for legacy Elasticsearch data outside /srv
  ansible.builtin.stat:
    path: /var/lib/elasticsearch/nodes
  register: elasticsearch_legacy_data
  when: elastic_stack_deploy_elasticsearch

- name: Protect legacy Elasticsearch data
  ansible.builtin.assert:
    that:
      - not elasticsearch_legacy_data.stat.exists
    fail_msg: >-
      Existing Elasticsearch data was found under /var/lib/elasticsearch.
      Migrate or explicitly review it before switching to /srv/elasticsearch/data.
  when: elastic_stack_deploy_elasticsearch
